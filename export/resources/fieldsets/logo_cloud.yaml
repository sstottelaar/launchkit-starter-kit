title: "Logo cloud"
fields:
  - handle: pretitle
    field: text_media.pretitle
  - import: heading
  - handle: text
    field: text_media.text
  - handle: logos
    field:
      type: assets
      container: assets
      display: Logos
      instructions: 'Upload partner or client logos. Best as SVG or PNG with transparent background.'
      instructions_position: below
  - handle: collapsible
    field:
      default: true
      type: toggle
      display: Collapsible
  - handle: intro_alignment
    field: intro_alignment.intro_alignment

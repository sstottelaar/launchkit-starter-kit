<nav class="hidden lg:block" aria-label="{{ trans key='Main navigation' }}">
    <ul class="flex items-center gap-2">
        {{ nav:main max_depth="2" include_home="false" select="title|url" }}
            <li
                x-data="{ subnavOpen: false, isTouchDevice: false }"
                @keydown.escape.stop.prevent="subnavOpen = false"
                @mouseenter="if (!isTouchDevice) subnavOpen = true"
                @mouseleave="if (!isTouchDevice) subnavOpen = false"
                @touchstart.prevent="isTouchDevice = true; subnavOpen = !subnavOpen"
                @click.outside="subnavOpen = false"
                @focusout.window="setTimeout(() => { if (!$el.contains(document.activeElement)) subnavOpen = false }, 0)"
                class="relative leading-none"
            >
                <a
                    class="flex px-4 py-2.5 items-center gap-2 font-medium hover:text-primary {{ is_current || is_parent ? 'text-primary' : 'text-shade-700' }}"
                    href="{{ url }}"
                    {{ if children }}
                        :aria-expanded="subnavOpen"
                        @focus="if (!isTouchDevice) subnavOpen = true"
                        @keydown.down.prevent="subnavOpen = true; $nextTick(() => $refs.subnav?.querySelector('a')?.focus())"
                    {{ /if }}
                    {{ is_current ?= 'aria-current="page"' }}
                >
                    <span>{{ title }}</span>
                    {{ if children }}
                        {{ partial:components/icon icon="caret-down" }}
                    {{ /if }}
                </a>
                {{ if children }}
                    <ul
                        x-show="subnavOpen"
                        x-ref="subnav"
                        class="absolute left-0 px-4 py-3 bg-white border border-gray-100 rounded-lg shadow-lg"
                        x-transition.duration.300ms
                        x-cloak
                        role="menu"
                        @keydown.down.prevent="const links = $el.querySelectorAll('a'); const i = Array.from(links).indexOf(document.activeElement); if (i < links.length - 1) links[i + 1].focus()"
                        @keydown.up.prevent="const links = $el.querySelectorAll('a'); const i = Array.from(links).indexOf(document.activeElement); if (i > 0) links[i - 1].focus(); else $el.closest('li').querySelector('a').focus()"
                    >
                        {{ children }}
                            <li role="none">
                                <a
                                    role="menuitem"
                                    class="whitespace-nowrap py-2 block font-medium hover:text-primary {{ is_current || is_parent ? 'text-primary' : 'text-shade-700' }}"
                                    href="{{ url }}"
                                    {{ is_current ?= 'aria-current="page"' }}
                                    @touchstart.stop
                                >
                                    {{ title }}
                                </a>
                            </li>
                        {{ /children }}
                    </ul>
                {{ /if }}
            </li>
        {{ /nav:main }}
    </ul>
</nav>

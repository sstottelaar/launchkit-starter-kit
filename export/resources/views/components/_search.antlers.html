<div
    class="fixed inset-0 z-50 flex justify-center w-full pointer-events-none lg:pt-24"
    x-data="search"
    x-cloak
    x-show="$store.searchOverlay.open"
>
    <div
        role="dialog"
        aria-modal="true"
        aria-labelledby="search-dialog-title"
        class="self-start w-full bg-white shadow-xl pointer-events-auto rounded-b-xl lg:rounded-lg lg:w-1/2 lg:max-w-xl"
        x-transition.origin.top.duration.300ms
        x-show="$store.searchOverlay.open"
        x-trap="$store.searchOverlay.open"
        x-effect="if ($store.searchOverlay.open) $nextTick(() => { $refs.searchInput.focus() })"
        @keydown.escape.window="$store.searchOverlay.open = false"
        @keydown.down="
            const links = $el.querySelectorAll('.search-result-link');
            if (links.length === 0) return;
            const current = document.activeElement;
            if (current === $refs.searchInput) {
                $event.preventDefault();
                links[0].focus();
            } else if (current?.classList?.contains('search-result-link')) {
                const i = Array.from(links).indexOf(current);
                if (i < links.length - 1) {
                    $event.preventDefault();
                    links[i + 1].focus();
                }
            }
        "
        @keydown.up="
            const links = $el.querySelectorAll('.search-result-link');
            if (links.length === 0) return;
            const current = document.activeElement;
            if (current?.classList?.contains('search-result-link')) {
                $event.preventDefault();
                const i = Array.from(links).indexOf(current);
                if (i > 0) links[i - 1].focus();
                else $refs.searchInput.focus();
            }
        "
    >
        <div
            class="flex items-center justify-between px-5 py-4 border-b border-shade-100"
        >
            <span id="search-dialog-title" class="text-sm font-medium text-shade-600 tracking-wide">
                {{ trans key="Search in website" }}
            </span>

            <button
                type="button"
                aria-label="{{ trans key='Close search' }}"
                @click="$store.searchOverlay.open = false"
                class="flex items-center justify-center w-9 h-9 -mr-1 rounded-lg hover:bg-shade-100 text-shade-500 hover:text-shade-700"
            >
                {{ partial:components/icon icon="x" classes="block leading-none!" }}
            </button>
        </div>

        <div class="px-4 py-4">
            <div class="relative">
                <input
                    type="search"
                    name="search"
                    x-model="search"
                    placeholder="{{ trans key='Search' }}"
                    aria-label="{{ trans key='Search in website' }}"
                    class="w-full py-3 pl-10 pr-4 text-base text-shade-800 placeholder:text-shade-400 bg-shade-50 border-0 rounded-lg focus:ring-2 focus:ring-primary/20 focus:bg-white"
                    x-ref="searchInput"
                    autocomplete="off"
                />

                <div class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-shade-500">
                    <template x-if="!loading">
                        <span>{{ partial:components/icon icon="magnifying-glass" classes="block leading-none!" }}</span>
                    </template>
                    <template x-if="loading">
                        <span class="animate-spin">{{ partial:components/icon icon="circle-notch" classes="block leading-none!" }}</span>
                    </template>
                </div>
            </div>
        </div>

        <template x-if="search">
            <div class="border-t border-shade-100 max-h-[min(60vh,400px)] overflow-y-auto overflow-x-hidden pb-4">
                <template x-if="!loading && results.length > 0">
                    <div class="divide-y divide-shade-100 min-w-0">
                        <template x-for="item in results" :key="item.url">
                            <a
                                :href="item.url"
                                :title="item.title"
                                class="search-result-link block px-5 py-4 min-w-0 hover:bg-shade-100 focus:bg-shade-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-primary/30"
                            >
                                <span
                                    x-text="item.title"
                                    class="block text-base font-semibold text-shade-900 mb-1 truncate"
                                ></span>
                                <template x-if="item.snippet">
                                    <span
                                        x-html="item.snippet"
                                        class="block text-sm text-shade-600 leading-relaxed line-clamp-2 overflow-hidden break-words [&_mark]:font-semibold [&_mark]:rounded-sm"
                                    ></span>
                                </template>
                                <span
                                    x-text="item.url"
                                    class="block mt-1.5 text-xs text-shade-400 font-mono truncate"
                                ></span>
                            </a>
                        </template>
                    </div>
                </template>

                <template x-if="!loading && search && results.length === 0">
                    <div class="px-5 py-8 text-center">
                        <p class="text-sm text-shade-500">
                            {{ trans key='No results for' }}
                            <span x-text="search" class="font-medium text-shade-700"></span>
                        </p>
                    </div>
                </template>
            </div>
        </template>
    </div>
</div>

<div
    class="fixed inset-0 z-40 bg-shade-700/30 backdrop-blur-xs"
    x-data
    x-cloak
    x-show="$store.searchOverlay.open"
    x-transition.opacity.duration.300ms
    @touchstart.prevent="$store.searchOverlay.open = false"
    @mousedown.prevent="$store.searchOverlay.open = false"
></div>
